<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYVORA Risk Scanner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #05070b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #f4c84a;
      margin-bottom: 10px;
    }

    .tagline {
      color: #8f98a8;
      margin-bottom: 40px;
      font-size: 15px;
    }

    .card {
      background: #0b0f17;
      border: 1px solid #202938;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 110, 255, 0.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      color: #9ca6b5;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 16px;
      background: #05070b;
      border: 1px solid #303a4d;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #1976ff;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #f4c84a;
      color: #05070b;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #080c13;
      border: 1px solid #263246;
      text-align: left;
    }

    .result h2 {
      margin-bottom: 12px;
    }

    .score {
      font-size: 36px;
      font-weight: 800;
      color: #f4c84a;
      margin-bottom: 10px;
    }

    .level {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .token-info {
      color: #c5ccd8;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .signals {
      margin-top: 15px;
    }

    .signal {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #263246;
      border-radius: 8px;
      background: #0b1019;
    }

    .signal-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .signal-description {
      color: #9ca6b5;
      font-size: 13px;
      line-height: 1.5;
    }

    .note {
      color: #8f98a8;
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .error {
      color: #ff8f8f;
    }

    footer {
      margin-top: 25px;
      color: #596273;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">KYVORA</div>

    <div class="tagline">
      AI-POWERED CRYPTO RISK INTELLIGENCE
    </div>

    <div class="card">

      <h1>Risk Scanner</h1>

      <p class="description">
        Analyze a Solana token address and understand its potential risk signals.
      </p>

      <input
        id="tokenAddress"
        type="text"
        placeholder="Enter Solana token address"
      >

      <button id="scanButton" onclick="scanToken()">
        SCAN TOKEN
      </button>

      <div class="result" id="result">

        <h2>KYVORA Analysis</h2>

        <div class="score" id="score">
          —
        </div>

        <div class="level" id="level">
          —
        </div>

        <div class="token-info" id="tokenInfo">
        </div>

        <div class="signals" id="signals">
        </div>

        <p class="note" id="note">
          Analysis powered by KYVORA and Helius data.
        </p>

      </div>

    </div>

    <footer>
      KYVORA • Built for the Solana ecosystem • Launching soon
    </footer>

  </div>

  <script>
    async function scanToken() {

      const address = document.getElementById("tokenAddress").value.trim();
      const result = document.getElementById("result");
      const score = document.getElementById("score");
      const level = document.getElementById("level");
      const tokenInfo = document.getElementById("tokenInfo");
      const signals = document.getElementById("signals");
      const note = document.getElementById("note");
      const button = document.getElementById("scanButton");

      if (!address) {
        alert("Please enter a Solana token address.");
        return;
      }

      result.style.display = "block";
      button.disabled = true;
      button.textContent = "ANALYZING...";
      score.textContent = "—";
      level.textContent = "Checking token...";
      tokenInfo.innerHTML = "";
      signals.innerHTML = "";
      note.textContent = "";

      try {

        const response = await fetch("/.netlify/functions/scan", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            address: address
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Unable to analyze token.");
        }

        score.textContent = data.risk.score + " / 100";
        level.textContent = "Risk Level: " + data.risk.level;

        tokenInfo.innerHTML = `
          <strong>Name:</strong> ${escapeHtml(data.token.name)}<br>
          <strong>Symbol:</strong> ${escapeHtml(data.token.symbol)}<br>
          <strong>Decimals:</strong> ${data.token.decimals}<br>
          <strong>Supply:</strong> ${data.token.supply}
        `;

        data.risk.signals.forEach(signal => {

          const div = document.createElement("div");
          div.className = "signal";

          div.innerHTML = `
            <div class="signal-title">
              ${escapeHtml(signal.level)} — ${escapeHtml(signal.title)}
            </div>
            <div class="signal-description">
              ${escapeHtml(signal.description)}
            </div>
          `;

          signals.appendChild(div);
        });

        note.textContent = "Analysis completed using live token data.";

      } catch (error) {

        score.textContent = "ERROR";
        level.textContent = "Analysis failed";
        tokenInfo.innerHTML =
          '<div class="error">' + escapeHtml(error.message) + "</div>";
        signals.innerHTML = "";
        note.textContent = "Please check the token address and try again.";

      } finally {

        button.disabled = false;
        button.textContent = "SCAN TOKEN";

      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
